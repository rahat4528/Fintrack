version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack_invoice_postgres
    environment:
      POSTGRES_USER: fintrack_user
      POSTGRES_PASSWORD: fintrack_invoice_password
      POSTGRES_DB: fintrack_invoice_db
    ports:
      - "5435:5432"
    volumes:
      - invoice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack_user -d fintrack_invoice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintrack_invoice_redis
    ports:
      - "6385:6379"
    volumes:
      - invoice_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  invoice_postgres_data:
  invoice_redis_data:
