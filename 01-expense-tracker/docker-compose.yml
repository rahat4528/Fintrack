version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack_expense_postgres
    environment:
      POSTGRES_USER: fintrack_admin
      POSTGRES_PASSWORD: fintrack_secure_password
      POSTGRES_DB: fintrack_expense_db
    ports:
      - "5431:5432"
    volumes:
      - fintrack_expense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack_admin -d fintrack_expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintrack_expense_redis
    ports:
      - "6381:6379"
    volumes:
      - fintrack_expense_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fintrack_expense_pgdata:
  fintrack_expense_redisdata:
